# yaml-language-server: $schema=https://www.openstatus.dev/schema.json
#
# OpenStatus monitor definitions for Atlas.
# Keep openstatus.lock with this file; the CLI uses it to map YAML entries to
# existing monitor IDs so `openstatus monitors apply` stays idempotent.

"9437":
  active: true
  frequency: 30m
  kind: http
  name: Atlas App
  openTelemetry: {}
  regions:
  - iad
  - ams
  - jnb
  - gru
  request:
    method: GET
    url: https://atlas.rebuildingus.org/
  retry: 3
  timeout: 45000
