name: Setup Atlas toolchain
description: Install pnpm, Node, optional Python+uv, and workspace dependencies for Atlas CI jobs.

inputs:
  python:
    description: Whether to install Python and uv.
    required: false
    default: "true"
  install-deps:
    description: Whether to run `pnpm install --frozen-lockfile` after toolchain setup.
    required: false
    default: "true"
  pnpm-filter:
    description: Optional pnpm workspace filter used when installing dependencies.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: corepack enable

    - shell: bash
      run: corepack prepare pnpm@11.10.0 --activate

    - if: inputs.install-deps == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - if: inputs.install-deps != 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"

    - if: inputs.python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "api/uv.lock"

    - if: inputs.install-deps == 'true'
      shell: bash
      env:
        PNPM_FILTER: ${{ inputs.pnpm-filter }}
      run: |
        install_args=(install --frozen-lockfile)
        if [ -n "$PNPM_FILTER" ]; then
          install_args+=(--filter "$PNPM_FILTER")
        fi
        pnpm "${install_args[@]}"

    - if: inputs.install-deps == 'true' && inputs.python == 'true'
      shell: bash
      run: cd api && uv sync --frozen --extra dev
