name: Deploy Atlas API
description: Build, publish, and deploy the Atlas API Cloud Run service.

inputs:
  service-name:
    description: Cloud Run service name.
    required: true
  environment-name:
    description: Atlas runtime environment name.
    required: true
  image-registry:
    description: Artifact Registry repository path without the image name.
    required: true
  image-tag:
    description: Image tag to build and deploy.
    required: true
  cache-scope:
    description: Buildx cache scope.
    required: false
    default: atlas-api
  gcp-region:
    description: GCP region for Artifact Registry and Cloud Run.
    required: true
  workload-identity-provider:
    description: GCP workload identity provider.
    required: true
  service-account:
    description: GCP service account used for deployment.
    required: true
  database-url:
    description: Hosted database URL.
    required: true
  anthropic-api-key:
    description: Anthropic API key for discovery.
    required: true
  search-api-key:
    description: Search provider API key for discovery.
    required: false
    default: ""
  auth-internal-secret:
    description: Shared app/API internal auth secret.
    required: true
  edge-origin-secret:
    description: Shared Cloudflare/API origin identity secret.
    required: true
  auth-api-key-introspection-url:
    description: App endpoint the API calls to verify Atlas API keys. Defaults to <atlas-public-url>/api/auth/internal/api-key when omitted.
    required: false
    default: ""
  auth-membership-url:
    description: App origin the API calls for workspace membership checks. Defaults to atlas-public-url when omitted.
    required: false
    default: ""
  auth-membership-protection-bypass-secret:
    description: Optional Vercel automation bypass secret for protected membership checks.
    required: false
    default: ""
  atlas-public-url:
    description: Public Atlas app origin for this environment.
    required: true
  atlas-api-audience:
    description: Accepted OAuth audience values for this environment. Defaults to <atlas-public-url>/mcp when omitted.
    required: false
    default: ""
  operator-allowed-emails:
    description: Comma-separated operator email allowlist for hosted admin tools.
    required: false
    default: ""
  scheduler-job-name:
    description: Optional Cloud Scheduler job name for autonomous discovery.
    required: false
    default: ""
  openstatus-api-key:
    description: Optional OpenStatus API key for synthetic checks.
    required: false
    default: ""
  atproto-oauth-e2e-harness:
    description: Enable the explicit ATProto OAuth E2E harness for staging-only synthetic identity verification.
    required: false
    default: "0"

outputs:
  api-url:
    description: Cloud Run URL for the deployed API service.
    value: ${{ steps.api-url.outputs.url }}
  revision:
    description: Latest ready Cloud Run revision for the deployed API service.
    value: ${{ steps.api-url.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: access_token

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to Artifact Registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.gcp-region }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Run cloud cost preflight
      shell: bash
      env:
        GCP_REGION: ${{ inputs.gcp-region }}
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
        SERVICE_NAME: ${{ inputs.service-name }}
      run: node scripts/deploy/cloud-cost-preflight.mjs check

    - name: Build, push, and attest atlas-api
      uses: ./.github/actions/build-attest-push
      with:
        image: ${{ inputs.image-registry }}/atlas-api
        tag: ${{ inputs.image-tag }}
        context: .
        dockerfile: api/Dockerfile
        cache-scope: ${{ inputs.cache-scope }}

    - name: Resolve hosted auth config
      id: hosted-auth
      shell: bash
      env:
        ATLAS_PUBLIC_URL: ${{ inputs.atlas-public-url }}
        AUTH_API_KEY_INTROSPECTION_URL: ${{ inputs.auth-api-key-introspection-url }}
        AUTH_MEMBERSHIP_URL: ${{ inputs.auth-membership-url }}
        ATLAS_API_AUDIENCE: ${{ inputs.atlas-api-audience }}
      run: |
        set -euo pipefail

        public_url="${ATLAS_PUBLIC_URL%/}"
        if [[ -z "${public_url}" ]]; then
          echo "atlas-public-url is required to deploy hosted auth config." >&2
          exit 1
        fi

        introspection_url="${AUTH_API_KEY_INTROSPECTION_URL:-${public_url}/api/auth/internal/api-key}"
        membership_url="${AUTH_MEMBERSHIP_URL:-${public_url}}"
        api_audience="${ATLAS_API_AUDIENCE:-${public_url}/mcp}"

        {
          echo "auth-api-key-introspection-url=${introspection_url}"
          echo "auth-membership-url=${membership_url}"
          echo "atlas-api-audience=${api_audience}"
        } >> "${GITHUB_OUTPUT}"

    - name: Deploy ${{ inputs.service-name }}
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ inputs.service-name }}
        region: ${{ inputs.gcp-region }}
        image: ${{ inputs.image-registry }}/atlas-api:${{ inputs.image-tag }}
        flags: |
          --ingress=all
          --allow-unauthenticated
          --min-instances=0
          --max-instances=4
          --memory=768Mi
          --cpu=1
          --timeout=900
          --concurrency=1
          --port=8000
          --remove-env-vars=ATLAS_AUTH_ALLOWED_EMAILS
        env_vars: |
          ATLAS_MANAGED=true
          ATLAS_MULTI_USER=true
          ENVIRONMENT=${{ inputs.environment-name }}
          LOG_LEVEL=info
          DATABASE_BACKEND=postgres
          DATABASE_URL=${{ inputs.database-url }}
          ANTHROPIC_API_KEY=${{ inputs.anthropic-api-key }}
          SEARCH_API_KEY=${{ inputs.search-api-key }}
          ATLAS_AUTH_INTERNAL_SECRET=${{ inputs.auth-internal-secret }}
          ATLAS_EDGE_ORIGIN_SECRET=${{ inputs.edge-origin-secret }}
          ATLAS_AUTH_API_KEY_INTROSPECTION_URL=${{ steps.hosted-auth.outputs.auth-api-key-introspection-url }}
          ATLAS_AUTH_MEMBERSHIP_URL=${{ steps.hosted-auth.outputs.auth-membership-url }}
          ATLAS_AUTH_MEMBERSHIP_PROTECTION_BYPASS_SECRET=${{ inputs.auth-membership-protection-bypass-secret }}
          ATLAS_PUBLIC_URL=${{ inputs.atlas-public-url }}
          ATLAS_AUTH_JWT_AUDIENCES=${{ steps.hosted-auth.outputs.atlas-api-audience }}
          ATLAS_OPERATOR_ALLOWED_EMAILS=${{ inputs.operator-allowed-emails }}
          ATLAS_ATPROTO_OAUTH_E2E_HARNESS=${{ inputs.atproto-oauth-e2e-harness }}
          ATLAS_ANON_RATE_LIMIT_ENABLED=true
          ATLAS_ANON_RATE_LIMIT_READS_PER_MINUTE=30
          ATLAS_ANON_RATE_LIMIT_WRITES_PER_MINUTE=10
          ATLAS_ANON_RATE_LIMIT_TOTAL_PER_HOUR=120
          ATLAS_ANON_CREDENTIAL_RATE_LIMIT_PER_MINUTE=60
          ATLAS_ANON_CREDENTIAL_RATE_LIMIT_TOTAL_PER_HOUR=600
          ATLAS_TRUSTED_PROXY_HOPS=1
          ATLAS_TRUST_UNSIGNED_FORWARD_HEADERS=false
          CORS_ORIGINS=["${{ inputs.atlas-public-url }}"]

    - name: Get API service URL and revision
      id: api-url
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        GCP_REGION: ${{ inputs.gcp-region }}
      run: node scripts/deploy/cloud-run-release.mjs describe

    - name: Ensure Cloud Scheduler job for autonomous discovery
      if: ${{ inputs.scheduler-job-name != '' }}
      shell: bash
      env:
        API_URL: ${{ steps.api-url.outputs.url }}
        ATLAS_AUTH_INTERNAL_SECRET: ${{ inputs.auth-internal-secret }}
        GCP_REGION: ${{ inputs.gcp-region }}
        JOB_NAME: ${{ inputs.scheduler-job-name }}
      run: node scripts/deploy/cloud-run-release.mjs ensure-scheduler

    - name: Run OpenStatus synthetics
      if: ${{ inputs.openstatus-api-key != '' }}
      uses: openstatushq/openstatus-github-action@adb7e3ec5e8918d11b7e73ffa74a873ce62b5f75 # v1
      with:
        api_key: ${{ inputs.openstatus-api-key }}
        config_path: config.openstatus.yaml
      continue-on-error: true

    - name: Write deploy summary
      if: always()
      shell: bash
      env:
        ATLAS_DEPLOY_MODE: ${{ inputs.environment-name }}
        API_URL: ${{ steps.api-url.outputs.url }}
        API_REVISION: ${{ steps.api-url.outputs.revision }}
        IMAGE: ${{ inputs.image-registry }}/atlas-api:${{ inputs.image-tag }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: node scripts/deploy/cloud-run-release.mjs summary
