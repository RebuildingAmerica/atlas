name: Repair Production Billing Configuration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type REPAIR_LIVE_ATLAS_BILLING to update the existing webhook and Atlas portal.
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'REPAIR_LIVE_ATLAS_BILLING'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
      - name: Keep new sales closed during repair
        env:
          ATLAS_BILLING_CHECKOUT_ENABLED: ${{ vars.ATLAS_BILLING_CHECKOUT_ENABLED }}
        run: |
          if [ "$ATLAS_BILLING_CHECKOUT_ENABLED" = "true" ]; then
            echo "::error title=Checkout is open::Close new sales before repairing live billing configuration."
            exit 1
          fi
      - name: Require dedicated live repair credentials
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
        run: |
          if [ -z "$STRIPE_API_KEY" ] || [ -z "$STRIPE_ATLAS_CATALOG" ]; then
            echo "::error title=Live repair credentials missing::Set ATLAS_STRIPE_LIVE_REPAIR_KEY and ATLAS_STRIPE_LIVE_CATALOG in the production GitHub environment. Vercel sensitive settings cannot be exported to this workflow."
            exit 1
          fi
      - name: Link the production Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=Vercel access missing::Production billing settings cannot be read or updated."
            exit 1
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Repair live Stripe webhook and portal
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
          ATLAS_PUBLIC_URL: https://atlas.rebuildingus.org
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ATLAS_PORTAL_ID_FILE: ${{ runner.temp }}/atlas-portal-id
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ci/repair-production-billing.ts --apply "$ATLAS_PORTAL_ID_FILE"
          portal_id="$(cat "$ATLAS_PORTAL_ID_FILE")"
          if [[ ! "$portal_id" =~ ^bpc_[A-Za-z0-9]+$ ]]; then
            echo "::error title=Portal ID invalid::Stripe did not return a usable Atlas portal configuration."
            exit 1
          fi
          pnpm exec vercel env add STRIPE_BILLING_PORTAL_CONFIGURATION production \
            --value "$portal_id" --force --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
      - name: Read back Stripe configuration and Vercel setting presence
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
          ATLAS_PUBLIC_URL: https://atlas.rebuildingus.org
          ATLAS_PORTAL_ID_FILE: ${{ runner.temp }}/atlas-portal-id
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          STRIPE_BILLING_PORTAL_CONFIGURATION="$(cat "$ATLAS_PORTAL_ID_FILE")" \
            pnpm exec tsx scripts/ci/repair-production-billing.ts --verify
          pnpm exec vercel env list production --format json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" \
            | node scripts/ci/verify-production-portal-env.mjs
      - name: Record the decision boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The existing Atlas live webhook subscriptions and customer portal configuration were repaired and read back through Stripe. Vercel accepted the portal ID, and its Production setting name was read back. Sensitive Vercel values cannot be exported here, so the deployed runtime value remains unverified until the next production deployment and a guarded portal-session check. Checkout remains closed. This does not establish a genuine charge, signed webhook delivery, entitlement, cancellation, or refund acceptance.
          EOF
