name: Repair Production Billing Configuration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type REPAIR_LIVE_ATLAS_BILLING to update the existing webhook and Atlas portal.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-production-billing-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'REPAIR_LIVE_ATLAS_BILLING'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
      - name: Keep new sales closed during repair
        env:
          ATLAS_BILLING_CHECKOUT_ENABLED: ${{ vars.ATLAS_BILLING_CHECKOUT_ENABLED }}
        run: |
          if [ "$ATLAS_BILLING_CHECKOUT_ENABLED" != "false" ]; then
            echo "::error title=Checkout closure required::Set ATLAS_BILLING_CHECKOUT_ENABLED=false before repairing live billing configuration."
            exit 1
          fi
      - name: Require dedicated live repair credentials
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
        run: |
          if [ -z "$STRIPE_API_KEY" ] || [ -z "$STRIPE_ATLAS_CATALOG" ]; then
            echo "::error title=Live repair credentials missing::Set ATLAS_STRIPE_LIVE_REPAIR_KEY and ATLAS_STRIPE_LIVE_CATALOG in the production GitHub environment."
            exit 1
          fi
          case "$STRIPE_API_KEY" in
            rk_live_*) ;;
            *) echo "::error title=Restricted live key required::Use a restricted production Stripe key for billing repair."; exit 1 ;;
          esac
      - name: Repair live Stripe webhook and portal
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
          ATLAS_PUBLIC_URL: https://atlas.rebuildingus.org
          ATLAS_PORTAL_ID_FILE: ${{ runner.temp }}/atlas-portal-id
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ci/repair-production-billing.ts --apply "$ATLAS_PORTAL_ID_FILE"
      - name: Read back Stripe configuration and retain the public portal identifier
        env:
          STRIPE_API_KEY: ${{ secrets.ATLAS_STRIPE_LIVE_REPAIR_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.ATLAS_STRIPE_LIVE_CATALOG }}
          ATLAS_PUBLIC_URL: https://atlas.rebuildingus.org
          ATLAS_PORTAL_ID_FILE: ${{ runner.temp }}/atlas-portal-id
          ATLAS_PORTAL_RECEIPT_FILE: ${{ runner.temp }}/atlas-billing-repair.json
        run: |
          set -euo pipefail
          STRIPE_BILLING_PORTAL_CONFIGURATION="$(cat "$ATLAS_PORTAL_ID_FILE")" \
            pnpm exec tsx scripts/ci/repair-production-billing.ts --verify
          node --input-type=module - <<'JS'
          import {readFileSync, writeFileSync, appendFileSync} from 'node:fs';
          const portalId = readFileSync(process.env.ATLAS_PORTAL_ID_FILE, 'utf8').trim();
          if (!/^bpc_[A-Za-z0-9]+$/.test(portalId)) throw Error('Invalid Atlas portal identifier.');
          writeFileSync(process.env.ATLAS_PORTAL_RECEIPT_FILE, JSON.stringify({
            schemaVersion: 1,
            publicOrigin: 'https://atlas.rebuildingus.org',
            portalConfigurationId: portalId,
            releaseSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            verifiedAt: new Date().toISOString(),
          }) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Stripe read-back passed. Set Production's STRIPE_BILLING_PORTAL_CONFIGURATION secret to \`${portalId}\` before Cloudflare publication. This identifier is not a credential. GitHub's workflow token cannot edit environment secrets, so this one-time installation requires an environment administrator.\n\n` +
            'Checkout remains closed. No hosting configuration, customer, charge, refund or subscription was changed. Deployed billing acceptance still requires the protected Cloudflare journey checks.\n');
          JS
      - name: Retain the verified non-secret billing receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-billing-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/atlas-billing-repair.json
          if-no-files-found: error
          retention-days: 14
