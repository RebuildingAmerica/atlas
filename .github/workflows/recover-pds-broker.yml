name: Recover existing PDS broker setting

on:
  workflow_dispatch:
    inputs:
      recipient-public-key:
        description: Base64 DER SPKI RSA-4096 public key; private key stays with the operator.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-hosted-publication
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Authenticate with the existing Google deployment identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Read and encrypt only the retained broker setting
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ATLAS_PDS_INSTANCE_NAME: ${{ secrets.ATLAS_PDS_INSTANCE_NAME }}
          ATLAS_PDS_INSTANCE_ZONE: ${{ secrets.ATLAS_PDS_INSTANCE_ZONE }}
          ATLAS_PDS_PUBLIC_URL: ${{ vars.ATLAS_PDS_PUBLIC_URL }}
          ATLAS_RECOVERY_PUBLIC_KEY: ${{ inputs.recipient-public-key }}
        run: node scripts/deploy/pds-broker-recovery.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pds-broker-encrypted-${{ github.run_id }}
          path: .atlas/pds-broker-recovery/broker.encrypted.json
          if-no-files-found: error
          retention-days: 1
