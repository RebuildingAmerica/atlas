name: Production Canary

# OpenStatus watches one URL: the app homepage. That page is static and
# answered 200 for the whole five-week outage that started on 2026-08-02,
# while the API, the PDS, the directory, the map and the sitemap were all
# down. A monitor that cannot fail is not a monitor.
#
# This checks the surfaces a reader actually depends on, and asks the catalog
# for real rows rather than trusting a health endpoint that returns ok while
# the database is unreachable.

on:
  schedule:
    # Hourly, not every 30 minutes: GitHub bills a minimum of one minute
    # per job and runner boot is most of the wall clock, so the tighter
    # schedule cost ~1,440 runner-minutes a month for ~2s of curl.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canary
  # Never cancel a probe in flight: a killed monitor reports nothing, which is
  # indistinguishable from a healthy one.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the public surfaces
        env:
          # From secrets, like every other workflow. A hardcoded origin keeps
          # probing a retired host, and a parked page that still answers 200 is
          # exactly the silent monitor this job exists to replace.
          APP_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          API_URL: ${{ secrets.ATLAS_API_URL }}
          PDS_URL: https://atlas-pds.rebuildingus.org
        run: |
          set -uo pipefail
          failures=0

          check_status() {
            local label="$1" url="$2" expected="$3"
            local actual
            # curl already prints 000 on a connection failure, so a fallback
            # echo would concatenate and report 000000.
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)"
            [ -n "$actual" ] || actual=000
            if [ "$actual" = "$expected" ]; then
              echo "ok    $label ($actual) $url"
            else
              echo "::error title=$label is unhealthy::Expected 200 from $url, got $actual."
              failures=$((failures + 1))
            fi
          }

          # /health is deliberately absent: it answers ok while the database is
          # unreachable, and the catalog probe below proves reachability and
          # content together.
          check_status "App"        "$APP_URL/"
          check_status "Sitemap"    "$APP_URL/sitemap.xml"
          check_status "PDS health" "$PDS_URL/xrpc/_health"

          # The directory is the product. A reachable API serving nothing is
          # still an outage to the person who came here to look someone up.
          # Parse the payload rather than grepping for a quoted key: an error
          # envelope that happens to carry an "id" field would pass a grep, and
          # a monitor that cannot fail is the thing being replaced.
          entries="$(curl -sS --max-time 25 "$API_URL/api/entities?limit=1")"
          count="$(printf '%s' "$entries" | jq 'try ((.items // []) | length) catch 0' 2>/dev/null)"
          if [ "${count:-0}" -ge 1 ]; then
            echo "ok    Catalog returns rows"
          else
            echo "::error title=Catalog is empty or unreachable::GET /api/entities?limit=1 returned no rows."
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error title=Production canary failed::$failures check(s) failed."
            exit 1
          fi
          echo "All production checks passed."
