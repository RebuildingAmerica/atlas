name: Production Canary

# Hourly probe of the app, the sitemap, the PDS, the catalog and search.

on:
  schedule:
    # Hourly: GitHub bills a minimum of a minute per job, and runner boot is
    # most of the wall clock.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canary
  # A cancelled probe reports nothing, which reads as healthy.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the public surfaces
        env:
          APP_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          API_URL: ${{ secrets.ATLAS_API_URL }}
          PDS_URL: https://atlas-pds.rebuildingus.org
        # curl exits non-zero on a timeout, and the default bash -e turns that
        # into a dead step with no diagnostics.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          failures=0

          fail() {
            echo "::error title=$1::$2"
            failures=$((failures + 1))
          }

          # curl prints 000 itself on a connection failure.
          check_status() {
            local label="$1" url="$2"
            local actual
            actual="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" 2>/dev/null || true)"
            if [ "$actual" = "200" ]; then
              echo "ok    $label ($actual)"
            else
              fail "$label is unhealthy" "Expected 200 from $url, got $actual."
            fi
          }

          # Counts items in an entities payload, or 0 for anything else. An
          # error envelope can carry an "id" field, so this parses.
          entity_count() {
            (curl -sS --max-time 30 "$1" 2>/dev/null || true) \
              | jq 'try ((.items // []) | length) catch 0' 2>/dev/null
          }

          # Cloud Run runs the API at min-instances=0, so the first request
          # after an idle hour pays a cold start. Absorb it here.
          curl -sS -o /dev/null --max-time 60 "$API_URL/health" 2>/dev/null || true

          # /health answers ok while the database is unreachable, so the
          # catalog probe below covers reachability and content together.
          check_status "App"        "$APP_URL/"
          check_status "Sitemap"    "$APP_URL/sitemap.xml"
          check_status "PDS health" "$PDS_URL/xrpc/_health"

          listed="$(entity_count "$API_URL/api/entities?limit=1")"
          if [ "${listed:-0}" -ge 1 ]; then
            echo "ok    Catalog returns rows"
          else
            fail "Catalog is empty or unreachable" "GET /api/entities?limit=1 returned no rows."
          fi

          # A different query path from the listing above.
          found="$(entity_count "$API_URL/api/entities?query=transit&limit=5")"
          if [ "${found:-0}" -ge 1 ]; then
            echo "ok    Search returns rows"
          else
            fail "Search is broken" "GET /api/entities?query=transit returned no rows."
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error title=Production canary failed::$failures check(s) failed."
            exit 1
          fi
          echo "All production checks passed."
