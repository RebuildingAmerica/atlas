name: Verify web hosting candidate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment for isolated candidate resources. Production requires a v* tag.
        type: choice
        options: [staging, production]
        default: staging
      architecture:
        description: Candidate to evaluate. This workflow does not change the canonical domain.
        type: choice
        options: [workers, hybrid]
        default: workers

permissions:
  contents: read

concurrency:
  group: web-hosting-candidate-${{ inputs.target }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted source ref
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET:$GITHUB_REF" in
            staging:refs/heads/main|staging:refs/tags/v*|production:refs/tags/v*) ;;
            *) echo 'Candidates require main or a release tag; production requires a release tag.' >&2; exit 1 ;;
          esac

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      profile: production
    secrets:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}

  candidate:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ATLAS_WEB_RUNTIME_ENV_JSON: ${{ secrets.ATLAS_WEB_RUNTIME_ENV_JSON }}
      ATLAS_WEB_EVIDENCE_JSON: ${{ vars.ATLAS_WEB_EVIDENCE_JSON }}
      ATLAS_CF_ACCESS_SERVICE_TOKEN_ID: ${{ secrets.ATLAS_CF_ACCESS_SERVICE_TOKEN_ID }}
      ATLAS_HOSTED_CF_ACCESS_CLIENT_ID: ${{ secrets.ATLAS_HOSTED_CF_ACCESS_CLIENT_ID }}
      ATLAS_HOSTED_CF_ACCESS_CLIENT_SECRET: ${{ secrets.ATLAS_HOSTED_CF_ACCESS_CLIENT_SECRET }}
      ATLAS_WEB_EVIDENCE_FILE: .atlas/web/evidence.json
      ATLAS_WEB_RUNTIME_FILE: .atlas/web/runtime.json
      TARGET: ${{ inputs.target }}
      ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
      - name: Validate measured baseline before provider writes
        run: |
          node --input-type=module - <<'JS'
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {assertCandidateBudget,loadWebRuntime} from './scripts/deploy/web-candidate.mjs';
          const evidence=JSON.parse(process.env.ATLAS_WEB_EVIDENCE_JSON || '{}');
          loadWebRuntime(process.env.ATLAS_WEB_RUNTIME_ENV_JSON || '{}');
          assertCandidateBudget(evidence,process.env.ARCHITECTURE);
          mkdirSync('.atlas/web',{recursive:true});
          writeFileSync(process.env.ATLAS_WEB_EVIDENCE_FILE,JSON.stringify(evidence));
          JS
      - if: inputs.architecture == 'hybrid'
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: inputs.architecture == 'hybrid'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: inputs.architecture == 'hybrid'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
      - name: Prepare runtime for the isolated protected hostname
        run: node scripts/deploy/web-candidate.mjs prepare-runtime --target "$TARGET" --architecture "$ARCHITECTURE" --output "$ATLAS_WEB_RUNTIME_FILE"
      - name: Build immutable candidate artifacts
        run: node scripts/deploy/web-runtime-command.mjs -- pnpm web:prepare --target "$TARGET" --architecture "$ARCHITECTURE"
      - name: Apply serialized additive authentication migrations
        run: node scripts/deploy/web-runtime-command.mjs -- pnpm web:migrate-auth
      - name: Publish isolated protected candidate
        run: pnpm web:publish-candidate --target "$TARGET" --architecture "$ARCHITECTURE" --directory ".atlas/web/$TARGET/$GITHUB_SHA/$ARCHITECTURE"
      - name: Retain redacted release identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ inputs.target }}-${{ inputs.architecture }}-${{ github.sha }}
          path: |
            .atlas/web/${{ inputs.target }}/${{ github.sha }}/${{ inputs.architecture }}/manifest.json
            .atlas/web/${{ inputs.target }}/${{ github.sha }}/${{ inputs.architecture }}/deployment.json
          if-no-files-found: ignore
          retention-days: 30
