name: Production Billing Readiness

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Production release tag whose configuration is being assessed.
        required: true
        type: string

run-name: Billing readiness for ${{ inputs.release_tag }}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
      - name: Resolve the production release under review
        env:
          ATLAS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$ATLAS_RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            echo "::error title=Invalid release tag::Use a vYYYY.MM.DD-N production tag."
            exit 1
          fi
          release_sha="$(git rev-parse --verify "refs/tags/${ATLAS_RELEASE_TAG}^{commit}")"
          echo "ATLAS_ASSESSED_RELEASE_TAG=$ATLAS_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "ATLAS_ASSESSED_RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - name: Inspect deployed Vercel and Stripe configuration without writing secrets to disk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ATLAS_PRODUCTION_CHECKOUT_FLAG: ${{ vars.ATLAS_BILLING_CHECKOUT_ENABLED }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=Billing inventory unavailable::The production Vercel project link or access token is missing."
            exit 1
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          pnpm exec vercel env run -e production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" -- \
            pnpm exec tsx scripts/ci/verify-production-billing.ts
