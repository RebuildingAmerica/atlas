name: Deploy Production
run-name: >-
  Production — ${{ fromJSON('{"doctor":"Check configuration (no deployment)","publish-api":"Publish API and discovery","publish-admin":"Publish protected admin","verify-api":"Verify deployed API","activate-api":"Start discovery consumers","pause-api":"Pause discovery consumers","promote-api":"Switch API routing","restore-api":"Restore previous API release","web-candidate":"Deploy and verify frontend candidate","adopt-web-baseline":"Record live frontend baseline","promote-web":"Switch frontend routing","finalize-web":"Finalize live frontend callbacks and admin","restore-routing":"Restore previous production routing"}')[inputs.operation || 'doctor'] }} — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment action. Doctor checks configuration and provider access without deploying.
        type: choice
        options:
          [
            doctor,
            publish-api,
            publish-admin,
            verify-api,
            activate-api,
            pause-api,
            promote-api,
            restore-api,
            web-candidate,
            adopt-web-baseline,
            promote-web,
            finalize-web,
            restore-routing,
          ]
        default: doctor
      source-run-id:
        description: Completed Deploy Production run containing the release artifacts to verify or promote.
        type: string
        required: false
      rollback-run-id:
        description: Successful production run containing the release to restore.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  artifact-metadata: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard-production-ref:
    name: Check release tag and main-branch ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require source already landed on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require v* release tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo 'Production publication requires a v* release tag.' >&2; exit 1 ;;
          esac
  publish:
    name: Run the selected production deployment action
    # Local hooks validate source; this workflow executes credentialed deployment.
    # Keep immutable artifact, trusted ref and hosted acceptance checks below.
    needs: guard-production-ref
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
      id-token: write
    uses: ./.github/workflows/cloudflare-publication.yml
    with:
      target: production
      operation: ${{ inputs.operation || 'doctor' }}
      source-run-id: ${{ inputs.source-run-id }}
      rollback-run-id: ${{ inputs.rollback-run-id }}
    secrets: inherit
