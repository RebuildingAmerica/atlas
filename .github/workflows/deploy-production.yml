name: Deploy Production
run-name: "Production — ${{ inputs.operation && inputs.operation != 'doctor' && inputs.operation || 'Configuration check (no deployment)' }} — ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run. Doctor checks configuration and deploys nothing.
        type: choice
        options:
          [
            doctor,
            publish-api,
            verify-api,
            activate-api,
            pause-api,
            promote-api,
            restore-api,
            web-candidate,
            promote-web,
            restore-routing,
          ]
        default: doctor
      source-run-id:
        description: Completed Deploy Production run retaining the exact release artifacts.
        type: string
        required: false
      rollback-run-id:
        description: Known-good Cloudflare production artifact run for routing recovery.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  artifact-metadata: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard-production-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reuse-ci: ${{ steps.validation.outputs.reuse-ci }}
      validated-run-id: ${{ steps.validation.outputs.validated-run-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require source already landed on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require v* release tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo 'Production publication requires a v* release tag.' >&2; exit 1 ;;
          esac
      - id: validation
        name: Find successful full production validation for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy/production-validation.mjs
  ci:
    needs: guard-production-ref
    if: needs.guard-production-ref.outputs.reuse-ci != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      profile: production
    secrets:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}
  publish:
    needs: [guard-production-ref, ci]
    if: >-
      always() && needs.guard-production-ref.result == 'success' &&
      (needs.ci.result == 'success' ||
      (needs.ci.result == 'skipped' && needs.guard-production-ref.outputs.reuse-ci == 'true'))
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
      id-token: write
    uses: ./.github/workflows/cloudflare-publication.yml
    with:
      target: production
      operation: ${{ inputs.operation || 'doctor' }}
      source-run-id: ${{ inputs.source-run-id }}
      rollback-run-id: ${{ inputs.rollback-run-id }}
    secrets: inherit
