name: Roll Back Production

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Deploy Production run retaining the interrupted promotion and routing snapshot.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  artifact-metadata: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require source already landed on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require trusted release automation
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo 'Production recovery requires a v* release tag.' >&2; exit 1 ;;
          esac
  recover:
    needs: guard
    uses: ./.github/workflows/cloudflare-publication.yml
    with:
      target: production
      operation: restore-routing
      source-run-id: ${{ inputs.source-run-id }}
    secrets: inherit
