name: CI

on:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_call:
    inputs:
      profile:
        description: CI optimization profile. Production keeps the full gate.
        required: false
        type: string
        default: auto
    secrets:
      TURBO_TOKEN:
        required: false
      STRIPE_API_KEY:
        required: false
      STRIPE_ATLAS_CATALOG:
        required: false
    outputs:
      staging_api_deploy:
        description: Whether staging should rebuild and deploy atlas-api.
        value: ${{ jobs.changes.outputs.staging_api_deploy }}
      staging_pds_deploy:
        description: Whether staging should deploy the Atlas-managed PDS host.
        value: ${{ jobs.changes.outputs.staging_pds_deploy }}
      hosted_smoke:
        description: Whether hosted smoke should run after CI.
        value: ${{ jobs.changes.outputs.hosted_smoke }}
      hosted_identity:
        description: Whether signed-in hosted identity verification should run after staging deploy.
        value: ${{ jobs.changes.outputs.hosted_identity }}

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      quality: ${{ steps.classify.outputs.quality }}
      python_tests: ${{ steps.classify.outputs.python_tests }}
      app_tests: ${{ steps.classify.outputs.app_tests }}
      browser_acceptance: ${{ steps.classify.outputs.browser_acceptance }}
      stripe_acceptance: ${{ steps.classify.outputs.stripe_acceptance }}
      contract: ${{ steps.classify.outputs.contract }}
      openapi: ${{ steps.classify.outputs.openapi }}
      docs: ${{ steps.classify.outputs.docs }}
      compose: ${{ steps.classify.outputs.compose }}
      actions_lint: ${{ steps.classify.outputs.actions_lint }}
      credential_scan: ${{ steps.classify.outputs.credential_scan }}
      deploy_scripts: ${{ steps.classify.outputs.deploy_scripts }}
      staging_api_deploy: ${{ steps.classify.outputs.staging_api_deploy }}
      staging_pds_deploy: ${{ steps.classify.outputs.staging_pds_deploy }}
      hosted_smoke: ${{ steps.classify.outputs.hosted_smoke }}
      hosted_identity: ${{ steps.classify.outputs.hosted_identity }}
      use_affected: ${{ steps.classify.outputs.use_affected }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
          install-deps: "false"
      - id: classify
        name: Classify changed surfaces
        env:
          ATLAS_CI_PROFILE: ${{ inputs.profile || 'auto' }}
          ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ATLAS_BEFORE_SHA: ${{ github.event.before }}
          ATLAS_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/changed-surfaces.mjs

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Validate Turbo task selectors
        run: pnpm run turbo:validate
      - name: Typecheck and lint
        env:
          TURBO_AFFECTED_FLAG: ${{ needs.changes.outputs.use_affected == 'true' && '--affected' || '' }}
        run: |
          affected_args=()
          if [ -n "$TURBO_AFFECTED_FLAG" ]; then
            affected_args=("$TURBO_AFFECTED_FLAG")
          fi
          pnpm exec turbo run typecheck lint "${affected_args[@]}"

  actions-lint:
    needs: changes
    if: needs.changes.outputs.actions_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
          install-deps: "false"
      - name: Lint GitHub Actions
        run: pnpm run actionlint

  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.deploy_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
          install-deps: "false"
      - name: Test deploy scripts
        run: pnpm run deploy:test

  test:
    needs: changes
    if: needs.changes.outputs.python_tests == 'true' || needs.changes.outputs.app_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret - disposable CI service password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret - disposable CI service URL
      ATLAS_SCOUT_E2E_FILE_CREDENTIAL_STORE: "1"
      RUN_PYTHON_TESTS: ${{ needs.changes.outputs.python_tests }}
      RUN_APP_TESTS: ${{ needs.changes.outputs.app_tests }}
      TURBO_AFFECTED_FLAG: ${{ needs.changes.outputs.use_affected == 'true' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Run test suites
        run: |
          affected_args=()
          if [ -n "$TURBO_AFFECTED_FLAG" ]; then
            affected_args=("$TURBO_AFFECTED_FLAG")
          fi

          if [ "$RUN_PYTHON_TESTS" = "true" ] || [ "$RUN_APP_TESTS" = "true" ]; then
            pnpm exec turbo run test "${affected_args[@]}"
          fi

  acceptance:
    needs: changes
    if: needs.changes.outputs.browser_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_SCOUT_E2E_FILE_CREDENTIAL_STORE: "1"
      ATLAS_E2E_API_URL: http://localhost:38000
      ATLAS_E2E_APP_URL: http://localhost:3100
      ATLAS_E2E_MAILBOX_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: pnpm --filter @rebuildingamerica/atlas-app exec playwright install-deps chromium
      - name: Install Playwright browser (retried; cached after first success)
        run: |
          for attempt in 1 2 3; do
            if timeout 480 pnpm --filter @rebuildingamerica/atlas-app exec playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser install attempt ${attempt} stalled or failed; retrying with a fresh connection..."
            sleep 5
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1
      - name: Run Playwright acceptance suite
        env:
          CI: "true"
        run: pnpm exec turbo run '@rebuildingamerica/atlas-app#test:acceptance:browser' --output-logs=full
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14

  stripe-acceptance:
    needs: changes
    if: needs.changes.outputs.stripe_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_SCOUT_E2E_FILE_CREDENTIAL_STORE: "1"
      ATLAS_E2E_API_URL: http://localhost:38000
      ATLAS_E2E_APP_URL: http://localhost:3100
      ATLAS_E2E_MAILBOX_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Verify Stripe credentials and catalog before spending CI time
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}
        run: pnpm run stripe:verify:ci
      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | sudo gpg --dearmor -o /usr/share/keyrings/stripe.gpg
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update
          sudo apt-get install -y stripe
          stripe version
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: pnpm --filter @rebuildingamerica/atlas-app exec playwright install-deps chromium
      - name: Install Playwright browser (retried; cached after first success)
        run: |
          for attempt in 1 2 3; do
            if timeout 480 pnpm --filter @rebuildingamerica/atlas-app exec playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser install attempt ${attempt} stalled or failed; retrying with a fresh connection..."
            sleep 5
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1
      - name: Run Stripe billing acceptance suite
        env:
          CI: "true"
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}
        run: pnpm exec turbo run '@rebuildingamerica/atlas-app#test:acceptance:stripe' --output-logs=full
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-stripe-test-results
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Run API contract tests
        run: pnpm run contract:test

  openapi-drift:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
      - name: Regenerate OpenAPI spec and client
        run: |
          pnpm run openapi
          pnpm --filter @rebuildingamerica/atlas-app run api-client
      - name: Verify generated artifacts are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated OpenAPI artifacts are out of date. Run 'pnpm openapi && pnpm --filter @rebuildingamerica/atlas-app run api-client' and commit the result."
            exit 1
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"
          pnpm-filter: docs
      - name: Validate docs
        run: pnpm run docs:validate
      - name: Check for broken links
        run: pnpm run docs:broken-links

  compose-validate:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Compose configurations
        run: sh ./scripts/compose-validate.sh

  secrets-scan:
    needs: changes
    if: needs.changes.outputs.credential_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"
      - name: Scan for committed secrets
        env:
          ATLAS_SECRETS_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATLAS_SECRETS_SCAN_HEAD_SHA: ${{ github.sha }}
          ATLAS_SECRETS_SCAN_CHANGED_ONLY: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: sh ./scripts/secrets-scan.sh
