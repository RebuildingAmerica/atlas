name: Build Cloudflare Python wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-python-wheels.yml
      - scripts/deploy/api-cloudflare-recipes.py

permissions:
  contents: read

concurrency:
  group: cloudflare-python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wasm wheel (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package:
          - inflate64==1.0.4
          - python-crfsuite==0.9.12
          - pydantic-core==2.46.4
          - lxml==6.1.1
          - cryptography==49.0.0
          - jiter==0.16.0
          - rpds-py==2026.6.3
          - regex==2026.6.28
          - doublemetaphone==1.2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: startsWith(matrix.package, 'cryptography==') || startsWith(matrix.package, 'lxml==')
        with:
          repository: pyodide/pyodide-recipes
          ref: 01bd0af95e3a2e8614cf7b8f302b962bb5896aea
          path: .atlas-pyodide-recipes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.23"
      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-emscripten
      - name: Install pinned cross-build environment
        run: uv tool run --from "pyodide-build[resolve]==0.39.1" pyodide xbuildenv install 314.0.7
      - name: Build existing native dependency for WebAssembly
        if: "!startsWith(matrix.package, 'cryptography==') && !startsWith(matrix.package, 'lxml==')"
        env:
          NATIVE_PACKAGE: ${{ matrix.package }}
        run: uv tool run --from "pyodide-build[resolve]==0.39.1" pyodide build "$NATIVE_PACKAGE" --outdir wheels
      - name: Build exact package with upstream static-library recipe
        if: startsWith(matrix.package, 'cryptography==') || startsWith(matrix.package, 'lxml==')
        env:
          NATIVE_PACKAGE: ${{ matrix.package }}
        run: |
          uv run --no-project --with PyYAML==6.0.3 python scripts/deploy/api-cloudflare-recipes.py --recipe-dir .atlas-pyodide-recipes/packages --package "$NATIVE_PACKAGE"
          uv tool run --from "pyodide-build[resolve]==0.39.1" pyodide build-recipes "${NATIVE_PACKAGE%%==*}" --recipe-dir .atlas-pyodide-recipes/packages --install --install-dir wheels --n-jobs 2
      - name: Record artifact identity
        run: sha256sum wheels/*.whl > wheels/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyodide-${{ matrix.package }}
          path: wheels/
          if-no-files-found: error
          retention-days: 14
