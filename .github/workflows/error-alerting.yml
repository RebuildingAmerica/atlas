name: Error Alerting

# Creates the Cloud Monitoring alerts on ERROR-severity API logs and on new
# visitor reports, and the email channel they notify. Dispatch by hand;
# re-running reconciles.

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: Address to notify when the API logs an error or a visitor reports a record.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Report what this service account may do
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        # The default bash -e exits on the first refusal, before this reports
        # which permission is missing.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          # gcloud has no test-iam-permissions command, so ask Resource
          # Manager directly which of these permissions the caller holds.
          token="$(gcloud auth print-access-token)"
          required='["monitoring.alertPolicies.create","monitoring.alertPolicies.list","monitoring.notificationChannels.create","logging.notificationRules.create","logging.logEntries.list"]'
          held="$(curl -sS -X POST \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"permissions\": $required}" | jq -r '(.permissions // [])[]')"
          missing=""
          for permission in $(echo "$required" | jq -r '.[]'); do
            if printf '%s\n' "$held" | grep -qx "$permission"; then
              echo "ok      $permission"
            else
              echo "::warning title=Missing permission::$permission is not granted to this service account."
              missing="$missing $permission"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Grant the monitoring role first::The deploy service account cannot create alerts. Missing:$missing. Run scripts/grant-monitoring-role.sh and dispatch this workflow again."
            exit 1
          fi

      - name: Provision the error and visitor-report alerts
        env:
          ALERT_EMAIL: ${{ inputs.alert_email }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE_NAME: ${{ secrets.ATLAS_API_SERVICE_NAME || 'atlas-api' }}
        # REST because `gcloud alpha monitoring` prompts to install the alpha
        # component, and a runner cannot answer it.
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          base="https://monitoring.googleapis.com/v3/projects/$GCP_PROJECT_ID"

          # A refusal prints Google's own reason, which names the missing
          # permission or the field it rejected, instead of a bare status.
          api() {
            local method="$1" url="$2" response status
            shift 2
            response="$(curl -sS -w '\n%{http_code}' -X "$method" "$url" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" "$@")"
            status="${response##*$'\n'}"
            response="${response%$'\n'*}"
            if [ "$status" -ge 300 ]; then
              echo "::error title=Cloud Monitoring refused $method::HTTP $status $(jq -c '.error // .' <<<"$response")" >&2
              return 1
            fi
            printf '%s\n' "$response"
          }

          channel="$(api GET "$base/notificationChannels" \
            | jq -r --arg email "$ALERT_EMAIL" \
              '(.notificationChannels // [])
               | map(select(.type == "email" and .labels.email_address == $email))
               | (.[0].name // "")')"

          if [ -z "$channel" ]; then
            channel="$(api POST "$base/notificationChannels" -d "$(jq -n \
              --arg email "$ALERT_EMAIL" \
              '{type: "email", displayName: "Atlas production errors",
                labels: {email_address: $email}, enabled: true}')" | jq -r .name)"
            echo "Created notification channel $channel"
          else
            echo "Reusing notification channel $channel"
          fi

          upsert_policy() {
            local display_name="$1" policy="$2" existing
            existing="$(api GET "$base/alertPolicies" \
              | jq -r --arg name "$display_name" \
                  '(.alertPolicies // [])
                   | map(select(.displayName == $name))
                   | (.[0].name // "")')"
            if [ -n "$existing" ]; then
              api PATCH "https://monitoring.googleapis.com/v3/$existing" -d "$policy" > /dev/null
              echo "Updated $existing"
            else
              api POST "$base/alertPolicies" -d "$policy" | jq -r '"Created " + .name'
            fi
          }

          # Cloud Run lifts "severity" out of the JSON that
          # atlas.platform.observability writes.
          upsert_policy "Atlas API errors" "$(jq -n \
            --arg service "$SERVICE_NAME" \
            --arg channel "$channel" \
            '{
              displayName: "Atlas API errors",
              documentation: {
                content: ("The Atlas API logged an error. Logs: https://console.cloud.google.com/run/detail/" + $service + "/logs"),
                mimeType: "text/markdown"
              },
              conditions: [{
                displayName: ("ERROR severity from " + $service),
                conditionMatchedLog: {
                  filter: ("resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"" + $service + "\" AND severity>=ERROR")
                }
              }],
              alertStrategy: {
                notificationRateLimit: {period: "300s"},
                autoClose: "1800s"
              },
              combiner: "OR",
              enabled: true,
              notificationChannels: [$channel]
            }')"

          # Atlas has one operator, so every visitor report has to reach them
          # without anyone watching the inbox. The event carries only the
          # report's reference and kind, never what the visitor wrote.
          upsert_policy "Atlas visitor reports" "$(jq -n \
            --arg service "$SERVICE_NAME" \
            --arg channel "$channel" \
            '{
              displayName: "Atlas visitor reports",
              documentation: {
                content: "A visitor reported a profile or source. Review it in the correction inbox: https://atlas.rebuildingus.org/admin/corrections",
                mimeType: "text/markdown"
              },
              conditions: [{
                displayName: ("Visitor report received by " + $service),
                conditionMatchedLog: {
                  filter: ("resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"" + $service + "\" AND jsonPayload.event=\"correction_report_received\"")
                }
              }],
              alertStrategy: {
                notificationRateLimit: {period: "300s"},
                autoClose: "1800s"
              },
              combiner: "OR",
              enabled: true,
              notificationChannels: [$channel]
            }')"
