name: Error Alerting

# Creates the Cloud Monitoring alert on ERROR-severity API logs and the email
# channel it notifies. Dispatch by hand; re-running reconciles.

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: Address to notify when the API logs an error.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Report what this service account may do
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        # The default bash -e exits on the first refusal, before this reports
        # which permission is missing.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          missing=""
          for permission in \
            monitoring.alertPolicies.create \
            monitoring.alertPolicies.list \
            monitoring.notificationChannels.create \
            logging.logEntries.list; do
            granted="$(gcloud projects test-iam-permissions "$GCP_PROJECT_ID" \
              --permissions="$permission" --format='value(permissions)' 2>&1 || true)"
            case "$granted" in *"$permission"*) granted="$permission" ;; *) granted="" ;; esac
            if [ -n "$granted" ]; then
              echo "ok      $permission"
            else
              echo "::warning title=Missing permission::$permission is not granted to this service account."
              missing="$missing $permission"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Grant the monitoring role first::The deploy service account cannot create alerts. Missing:$missing. Run scripts/grant-monitoring-role.sh and dispatch this workflow again."
            exit 1
          fi

      - name: Provision the error alert
        env:
          ALERT_EMAIL: ${{ inputs.alert_email }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE_NAME: ${{ secrets.ATLAS_API_SERVICE_NAME || 'atlas-api' }}
        # REST because `gcloud alpha monitoring` prompts to install the alpha
        # component, and a runner cannot answer it.
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          base="https://monitoring.googleapis.com/v3/projects/$GCP_PROJECT_ID"

          api() {
            local method="$1" url="$2"
            shift 2
            curl -sS --fail-with-body -X "$method" "$url" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" "$@"
          }

          channel="$(api GET "$base/notificationChannels" \
            | jq -r --arg email "$ALERT_EMAIL" \
              '(.notificationChannels // [])
               | map(select(.type == "email" and .labels.email_address == $email))
               | (.[0].name // "")')"

          if [ -z "$channel" ]; then
            channel="$(api POST "$base/notificationChannels" -d "$(jq -n \
              --arg email "$ALERT_EMAIL" \
              '{type: "email", displayName: "Atlas production errors",
                labels: {email_address: $email}, enabled: true}')" | jq -r .name)"
            echo "Created notification channel $channel"
          else
            echo "Reusing notification channel $channel"
          fi

          # Cloud Run lifts "severity" out of the JSON that
          # atlas.platform.observability writes.
          policy="$(jq -n \
            --arg service "$SERVICE_NAME" \
            --arg channel "$channel" \
            '{
              displayName: "Atlas API errors",
              documentation: {
                content: ("The Atlas API logged an error. Logs: https://console.cloud.google.com/run/detail/" + $service + "/logs"),
                mimeType: "text/markdown"
              },
              conditions: [{
                displayName: ("ERROR severity from " + $service),
                conditionMatchedLog: {
                  filter: ("resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"" + $service + "\" AND severity>=ERROR")
                }
              }],
              alertStrategy: {
                notificationRateLimit: {period: "300s"},
                autoClose: "1800s"
              },
              combiner: "OR",
              enabled: true,
              notificationChannels: [$channel]
            }')"

          existing="$(api GET "$base/alertPolicies" \
            | jq -r '(.alertPolicies // [])
                     | map(select(.displayName == "Atlas API errors"))
                     | (.[0].name // "")')"

          if [ -n "$existing" ]; then
            api PATCH "https://monitoring.googleapis.com/v3/$existing" -d "$policy" > /dev/null
            echo "Updated $existing"
          else
            api POST "$base/alertPolicies" -d "$policy" | jq -r '"Created " + .name'
          fi
