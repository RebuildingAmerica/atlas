name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hosted_public_url:
        description: Optional hosted Atlas URL to verify, such as a fresh Vercel preview deployment.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      profile: staging
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}

  deploy-api:
    needs: ci
    if: needs.ci.outputs.staging_api_deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/deploy-atlas-api
        id: deploy-api
        with:
          service-name: atlas-api-staging
          environment-name: staging
          image-registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/atlas-images
          image-tag: ${{ github.sha }}
          cache-scope: atlas-api-staging
          gcp-region: ${{ secrets.GCP_REGION }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          database-url: ${{ secrets.DATABASE_URL }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          search-api-key: ${{ secrets.SEARCH_API_KEY }}
          auth-internal-secret: ${{ secrets.ATLAS_AUTH_INTERNAL_SECRET }}
          edge-origin-secret: ${{ secrets.ATLAS_EDGE_ORIGIN_SECRET }}
          auth-api-key-introspection-url: ${{ secrets.ATLAS_AUTH_API_KEY_INTROSPECTION_URL }}
          auth-membership-url: ${{ secrets.ATLAS_AUTH_MEMBERSHIP_URL }}
          auth-membership-protection-bypass-secret: ${{ secrets.ATLAS_AUTH_MEMBERSHIP_PROTECTION_BYPASS_SECRET }}
          atlas-public-url: ${{ secrets.ATLAS_PUBLIC_URL }}
          atlas-api-audience: ${{ secrets.ATLAS_API_AUDIENCE || secrets.ATLAS_AUTH_JWT_AUDIENCES }}
          operator-allowed-emails: ${{ secrets.ATLAS_OPERATOR_ALLOWED_EMAILS }}
          atproto-oauth-e2e-harness: "1"

  deploy-pds:
    needs: ci
    if: needs.ci.outputs.staging_pds_deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/deploy-atlas-pds
        with:
          environment-name: staging
          gcp-project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          instance-name: ${{ secrets.ATLAS_PDS_INSTANCE_NAME }}
          instance-zone: ${{ secrets.ATLAS_PDS_INSTANCE_ZONE }}
          pds-hostname: atlas-pds-staging.rebuildingus.org
          pds-public-url: https://atlas-pds-staging.rebuildingus.org

  hosted-smoke:
    needs:
      - ci
      - deploy-api
      - deploy-pds
    if: always() && needs.ci.result == 'success' && needs.ci.outputs.hosted_smoke == 'true' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') && (needs.deploy-pds.result == 'success' || needs.deploy-pds.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"

      - name: Mint Vercel Trusted Source OIDC token
        id: vercel-oidc
        uses: ./.github/actions/vercel-trusted-oidc

      - name: Run hosted Cloudflare API smoke
        env:
          ATLAS_HOSTED_EXPECT_EDGE: "true"
          ATLAS_HOSTED_PUBLIC_URL: ${{ github.event.inputs.hosted_public_url || secrets.ATLAS_PUBLIC_URL }}
          ATLAS_HOSTED_EXPECTED_PUBLIC_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          ATLAS_HOSTED_API_URL: ${{ secrets.ATLAS_API_URL }}
          ATLAS_HOSTED_PDS_URL: https://atlas-pds-staging.rebuildingus.org
          ATLAS_HOSTED_VERCEL_BYPASS_SECRET: ${{ secrets.ATLAS_HOSTED_VERCEL_BYPASS_SECRET || secrets.ATLAS_AUTH_MEMBERSHIP_PROTECTION_BYPASS_SECRET }}
          ATLAS_HOSTED_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: pnpm --filter @rebuildingamerica/atlas-app run test:hosted-smoke

  hosted-identity:
    needs:
      - ci
      - deploy-api
      - deploy-pds
      - hosted-smoke
    if: always() && needs.ci.result == 'success' && needs.ci.outputs.hosted_identity == 'true' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') && (needs.deploy-pds.result == 'success' || needs.deploy-pds.result == 'skipped') && needs.hosted-smoke.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"

      - name: Mint Vercel Trusted Source OIDC token
        id: vercel-oidc
        uses: ./.github/actions/vercel-trusted-oidc

      - name: Install Playwright browser
        run: |
          pnpm --filter @rebuildingamerica/atlas-app exec playwright install-deps chromium
          timeout 480 pnpm --filter @rebuildingamerica/atlas-app exec playwright install chromium

      - name: Run hosted ATProto identity verification
        env:
          ATLAS_HOSTED_PUBLIC_URL: ${{ github.event.inputs.hosted_public_url || secrets.ATLAS_PUBLIC_URL }}
          ATLAS_HOSTED_EXPECTED_PUBLIC_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          ATLAS_HOSTED_E2E_SECRET: ${{ secrets.ATLAS_HOSTED_E2E_SECRET }}
          ATLAS_HOSTED_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ATLAS_HOSTED_VERCEL_BYPASS_SECRET: ${{ secrets.ATLAS_HOSTED_VERCEL_BYPASS_SECRET || secrets.ATLAS_AUTH_MEMBERSHIP_PROTECTION_BYPASS_SECRET }}
          ATLAS_HOSTED_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: pnpm --filter @rebuildingamerica/atlas-app run test:hosted-identity
