name: Deploy Staging
run-name: >-
  Staging — ${{ fromJSON('{"doctor":"Check configuration (no deployment)","publish-api":"Publish API and discovery","verify-api":"Verify deployed API","activate-api":"Start discovery consumers","pause-api":"Pause discovery consumers","promote-api":"Switch API routing","restore-api":"Restore previous API release","web-candidate":"Deploy and verify frontend candidate","promote-web":"Switch frontend routing","restore-routing":"Restore previous production routing"}')[inputs.operation || 'doctor'] }} — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment action. Doctor checks configuration and provider access without deploying.
        type: choice
        options:
          [
            doctor,
            publish-api,
            verify-api,
            activate-api,
            pause-api,
            web-candidate,
          ]
        default: doctor
      source-run-id:
        description: Completed Deploy Staging run containing the release artifacts to verify or promote.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  artifact-metadata: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  guard-staging-ref:
    name: Check staging source and main-branch ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require source already landed on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require trusted staging source
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo 'Staging publication requires main or a v* release tag.' >&2; exit 1 ;;
          esac
  ci:
    name: Validate staging source
    needs: guard-staging-ref
    uses: ./.github/workflows/ci.yml
    with:
      profile: production
    secrets:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}
  publish:
    name: Run the selected staging deployment action
    needs: ci
    permissions:
      contents: read
      actions: read
      artifact-metadata: write
      id-token: write
    uses: ./.github/workflows/cloudflare-publication.yml
    with:
      target: staging
      configuration-environment: ${{ inputs.operation != 'doctor' && 'production' || 'staging' }}
      operation: ${{ inputs.operation || 'doctor' }}
      source-run-id: ${{ inputs.source-run-id }}
    secrets: inherit
