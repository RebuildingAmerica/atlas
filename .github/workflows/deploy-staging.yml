name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Protected private validation phase; no canonical production routing.
        type: choice
        options:
          [
            doctor,
            publish-api,
            verify-api,
            activate-api,
            pause-api,
            web-candidate,
          ]
        default: doctor
      source-run-id:
        description: Completed Deploy Staging run retaining the exact release artifacts.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  artifact-metadata: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  guard-staging-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require source already landed on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require trusted staging source
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo 'Staging publication requires main or a v* release tag.' >&2; exit 1 ;;
          esac
  ci:
    needs: guard-staging-ref
    uses: ./.github/workflows/ci.yml
    with:
      profile: production
    secrets:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_ATLAS_CATALOG: ${{ secrets.STRIPE_ATLAS_CATALOG }}
  publish:
    needs: ci
    uses: ./.github/workflows/cloudflare-publication.yml
    with:
      target: staging
      operation: ${{ inputs.operation || 'doctor' }}
      source-run-id: ${{ inputs.source-run-id }}
    secrets: inherit
