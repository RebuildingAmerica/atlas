name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit # pragma: allowlist secret

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-toolchain
        with:
          python: "false"

      - name: Deploy staging web app to Vercel Preview
        id: deploy-web
        env:
          ATLAS_PUBLIC_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: rebuilding-america-project
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for name in ATLAS_PUBLIC_URL VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing staging deploy configuration::${name} is required for the Deploy Staging workflow." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          deploy_output="$(pnpm exec vercel deploy --cwd app --target preview --archive=tgz --yes --scope "${VERCEL_SCOPE}" --token "${VERCEL_TOKEN}")"
          printf '%s\n' "${deploy_output}"

          deployment_url="$(printf '%s\n' "${deploy_output}" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          if [[ -z "${deployment_url}" ]]; then
            echo "::error title=Vercel deployment URL not found::The Vercel CLI did not print a deployment URL." >&2
            exit 1
          fi

          staging_host="${ATLAS_PUBLIC_URL#https://}"
          staging_host="${staging_host#http://}"
          staging_host="${staging_host%%/*}"
          if [[ -z "${staging_host}" ]]; then
            echo "::error title=Invalid staging app origin::ATLAS_PUBLIC_URL must be an absolute app origin." >&2
            exit 1
          fi

          pnpm exec vercel alias set "${deployment_url}" "${staging_host}" --scope "${VERCEL_SCOPE}" --token "${VERCEL_TOKEN}"

          inspect_output="$(pnpm exec vercel inspect "${staging_host}" --scope "${VERCEL_SCOPE}" --token "${VERCEL_TOKEN}")"
          printf '%s\n' "${inspect_output}"
          if ! grep -Fq "${deployment_url}" <<<"${inspect_output}"; then
            echo "::error title=Staging alias mismatch::${staging_host} does not point at ${deployment_url} after alias assignment." >&2
            exit 1
          fi

          {
            echo "deployment-url=${deployment_url}"
            echo "staging-host=${staging_host}"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/deploy-atlas-api
        id: deploy-api
        with:
          service-name: atlas-api-staging
          environment-name: staging
          image-registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/atlas-images
          image-tag: ${{ github.sha }}
          cache-scope: atlas-api-staging
          gcp-region: ${{ secrets.GCP_REGION }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          database-url: ${{ secrets.DATABASE_URL }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          search-api-key: ${{ secrets.SEARCH_API_KEY }}
          auth-internal-secret: ${{ secrets.ATLAS_AUTH_INTERNAL_SECRET }}
          edge-origin-secret: ${{ secrets.ATLAS_EDGE_ORIGIN_SECRET }}
          auth-api-key-introspection-url: ${{ secrets.ATLAS_AUTH_API_KEY_INTROSPECTION_URL }}
          auth-membership-url: ${{ secrets.ATLAS_AUTH_MEMBERSHIP_URL }}
          atlas-public-url: ${{ secrets.ATLAS_PUBLIC_URL }}
          atlas-api-audience: ${{ secrets.ATLAS_API_AUDIENCE || secrets.ATLAS_AUTH_JWT_AUDIENCES }}
          operator-allowed-emails: ${{ secrets.ATLAS_OPERATOR_ALLOWED_EMAILS }}

      - name: Run hosted Cloudflare API smoke
        env:
          ATLAS_HOSTED_EXPECT_EDGE: "true"
          ATLAS_HOSTED_PUBLIC_URL: ${{ secrets.ATLAS_PUBLIC_URL }}
          ATLAS_HOSTED_API_URL: ${{ secrets.ATLAS_API_URL }}
          ATLAS_HOSTED_VERCEL_BYPASS_SECRET: ${{ secrets.ATLAS_HOSTED_VERCEL_BYPASS_SECRET }}
        run: pnpm --filter @rebuildingamerica/atlas-app run test:hosted-smoke
