name: Diagnose Atlas API

# Read-only incident check for when the Atlas API stops answering. It reports
# what Cloud Run says about the service and its newest revisions, whether the
# image the serving revision runs still exists, and the exact error the
# database returns to a plain connection attempt. It never prints the database
# URL or any secret, and it changes nothing.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which environment's API to inspect.
        required: true
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Report the Cloud Run service and its newest revisions
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          TARGET: ${{ inputs.target }}
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          service="atlas-api"
          if [ "$TARGET" = "staging" ]; then service="atlas-api-staging"; fi
          echo "service=$service" >> "$GITHUB_ENV"
          echo "## Service conditions"
          gcloud run services describe "$service" --region "$GCP_REGION" \
            --format='yaml(metadata.generation,status.observedGeneration,status.conditions,status.traffic,status.latestReadyRevisionName,status.latestCreatedRevisionName)' 2>&1
          echo "## Newest revisions"
          for revision in $(gcloud run revisions list --service "$service" --region "$GCP_REGION" \
            --limit 4 --format='value(metadata.name)' 2>&1); do
            echo "### $revision"
            gcloud run revisions describe "$revision" --region "$GCP_REGION" \
              --format='yaml(spec.containers[0].image,status.conditions)' 2>&1
          done

      - name: Check that the serving image still exists
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          serving="$(gcloud run services describe "$service" --region "$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)' 2>&1)"
          image="$(gcloud run revisions describe "$serving" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)' 2>&1)"
          echo "Serving revision: $serving"
          echo "Image: $image"
          gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)' 2>&1 \
            && echo "Image exists." || echo "Image lookup failed (see message above)."

      - name: Try a plain database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          python3 -m pip install --quiet "psycopg[binary]>=3.1"
          python3 - <<'PY'
          import os, time
          import psycopg
          started = time.monotonic()
          try:
              with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as conn:
                  conn.read_only = True
                  conn.execute("select 1").fetchone()
                  discovery = conn.execute("SELECT count(*) FROM discovery_jobs WHERE status IN ('claimed', 'running') AND claimed_by_user_id IS NULL").fetchone()[0]
                  firehose = conn.execute("SELECT count(*) FROM firehose_observation_deliveries WHERE status = 'claimed'").fetchone()[0]
              print(f"Database answered in {time.monotonic() - started:.1f}s.")
              print(f"Unfinished server discovery claims (including expired leases): {discovery}")
              print(f"Unfinished firehose claims (including expired leases): {firehose}")
          except Exception as exc:  # report the class and message, never the URL
              message = str(exc).replace(os.environ["DATABASE_URL"], "<database-url>")
              print(f"Database connection failed after {time.monotonic() - started:.1f}s: "
                    f"{type(exc).__name__}: {message}")
          PY

      - name: Read service instance observations without inferring zero from missing metrics
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        shell: bash --noprofile --norc {0}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError
          now = datetime.now(timezone.utc)
          project = os.environ["CLOUDSDK_CORE_PROJECT"]
          region = os.environ["GCP_REGION"]
          service = os.environ["service"]
          if not re.fullmatch(r"[a-z][a-z0-9-]+", project) or not re.fullmatch(r"[a-z]+-[a-z]+[0-9]+", region) or service not in ("atlas-api", "atlas-api-staging"):
              raise SystemExit("Explicit Atlas service identity required.")
          raw = json.loads(subprocess.check_output(["gcloud", "run", "services", "describe", service, "--region", region, "--format=json(metadata.annotations,spec.template.metadata.name,spec.template.spec.containers)"], text=True, stderr=subprocess.PIPE))
          containers = raw.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          settings = []
          for container in containers:
              selected = {}
              for item in container.get("env", []):
                  name = item.get("name", "").upper()
                  if name in ("DISCOVERY_INLINE", "DISCOVERY_JOB_WORKER_ENABLED", "FIREHOSE_DELIVERY_WORKER_ENABLED"):
                      value = str(item.get("value", "")).lower()
                      selected[name] = value if value in ("true", "false", "1", "0") else "unreadable"
              settings.append(selected)
          annotations = raw.get("metadata", {}).get("annotations", {})
          mode = annotations.get("run.googleapis.com/scalingMode")
          count = str(annotations.get("run.googleapis.com/manualInstanceCount", ""))
          revision = raw.get("spec", {}).get("template", {}).get("metadata", {}).get("name", "")
          print(json.dumps({"templateRevision": revision if re.fullmatch(r"atlas-api(?:-staging)?-[a-z0-9-]+", revision) else "unavailable", "explicitTemplateConsumerSettings": settings, "scalingMode": mode if mode in ("automatic", "manual") else "unspecified", "manualInstanceCount": int(count) if re.fullmatch(r"[0-9]{1,8}", count) else None, "absentSettingsAreNotRuntimeProof": True}))
          # The token remains in memory inside this existing WIF-authenticated
          # CI process. No browser/local credentials or raw responses are saved.
          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True, stderr=subprocess.PIPE).strip()
          query = {
              "filter": f'metric.type="run.googleapis.com/container/instance_count" AND resource.type="cloud_run_revision" AND resource.labels.service_name="{service}" AND resource.labels.location="{region}"',
              "interval.startTime": (now - timedelta(minutes=15)).isoformat(),
              "interval.endTime": now.isoformat(),
              "view": "FULL",
              "pageSize": 100000,
          }
          observations = []
          try:
              for page in range(10):
                  request = urllib.request.Request(f"https://monitoring.googleapis.com/v3/projects/{project}/timeSeries?{urllib.parse.urlencode(query)}", headers={"Authorization": f"Bearer {token}"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      report = json.load(response)
                  for series in report.get("timeSeries", []):
                      revision = series.get("resource", {}).get("labels", {}).get("revision_name", "")
                      state = series.get("metric", {}).get("labels", {}).get("state")
                      if not re.fullmatch(r"atlas-api(?:-staging)?-[a-z0-9-]+", revision) or state not in ("active", "idle"):
                          raise ValueError("Unexpected service metric identity")
                      points = []
                      for point in series.get("points", [])[:3]:
                          timestamp = point["interval"]["endTime"]
                          datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                          count = int(point["value"]["int64Value"])
                          if count < 0:
                              raise ValueError("Invalid instance count")
                          points.append({"observedAt": timestamp, "instances": count})
                      observations.append({"revision": revision, "state": state, "points": points})
                  if not report.get("nextPageToken"):
                      break
                  query["pageToken"] = report["nextPageToken"]
              else:
                  raise ValueError("Incomplete monitoring pagination")
              print(json.dumps({"observedAt": now.isoformat(), "service": service, "instanceObservations": observations, "missingMetricsProveZero": False, "ownershipCertified": False}))
          except HTTPError as error:
              print(json.dumps({"monitoring": "unavailable", "httpStatus": error.code, "ownershipCertified": False}))
          except Exception:
              raise SystemExit("Instance inventory failed; private provider diagnostics suppressed.")
          PY
