services:
  atlas-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_BACKEND: ${DATABASE_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      ENVIRONMENT: ${ENVIRONMENT}
      ATLAS_DEPLOY_MODE: ${ATLAS_DEPLOY_MODE}
      ENABLE_OPENAPI_SPEC: ${ENABLE_OPENAPI_SPEC}
      ATLAS_AUTH_INTERNAL_SECRET: ${ATLAS_AUTH_INTERNAL_SECRET}
      ATLAS_AUTH_API_KEY_INTROSPECTION_URL: http://atlas-web:3000/api/auth/internal/api-key
      ATLAS_AUTH_MEMBERSHIP_URL: http://atlas-web:3000
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL}
      ATLAS_AUTH_JWT_AUDIENCES: ${ATLAS_AUTH_JWT_AUDIENCES}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - atlas-data:/app/data

  atlas-web:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      atlas-api:
        condition: service_healthy
    environment:
      ATLAS_OPERATOR_ALLOWED_EMAILS: ${ATLAS_OPERATOR_ALLOWED_EMAILS}
      ATLAS_AUTH_API_KEY_INTROSPECTION_URL: http://atlas-web:3000/api/auth/internal/api-key
      ATLAS_AUTH_BASE_PATH: /api/auth
      ATLAS_AUTH_DB_PATH: /app/data/auth/atlas-auth.sqlite
      ATLAS_AUTH_INTERNAL_SECRET: ${ATLAS_AUTH_INTERNAL_SECRET}
      ATLAS_AUTH_JWT_AUDIENCES: ${ATLAS_AUTH_JWT_AUDIENCES}
      ATLAS_DEPLOY_MODE: ${ATLAS_DEPLOY_MODE}
      ATLAS_EMAIL_FROM: ${ATLAS_EMAIL_FROM}
      ATLAS_EMAIL_PROVIDER: ${ATLAS_EMAIL_PROVIDER}
      ATLAS_EMAIL_RESEND_API_KEY: ${ATLAS_EMAIL_RESEND_API_KEY}
      ATLAS_EMAIL_CAPTURE_URL: ${ATLAS_EMAIL_CAPTURE_URL}
      ATLAS_PDS_PUBLIC_URL: ${ATLAS_PDS_PUBLIC_URL}
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL}
      ATLAS_DOCS_URL: ${ATLAS_DOCS_URL}
      ATLAS_SERVER_API_PROXY_TARGET: http://atlas-api:8000
    restart: unless-stopped
    volumes:
      - atlas-data:/app/data

  atlas-pds:
    image: ghcr.io/bluesky-social/pds@sha256:b686e3252d17d33af1912273ca3fef3632d1620dd52a4cbb0fd62ba888ac402a
    restart: unless-stopped
    environment:
      PDS_HOSTNAME: ${ATLAS_PDS_HOSTNAME}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      PDS_DID_PLC_URL: ${PDS_DID_PLC_URL}
      PDS_DATA_DIRECTORY: ${PDS_DATA_DIRECTORY}
      PDS_BLOBSTORE_DISK_LOCATION: ${PDS_BLOBSTORE_DISK_LOCATION}
      PDS_PORT: ${PDS_PORT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:2583/xrpc/_health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - atlas-pds-data:/pds

  atlas-edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      atlas-api:
        condition: service_healthy
      atlas-web:
        condition: service_started
      atlas-pds:
        condition: service_healthy
    environment:
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  atlas-data:
  atlas-pds-data:
  caddy-data:
  caddy-config:
