  "@xmldom/xmldom": "^0.8.13"
  "fast-xml-parser": "^5.7.0"
  "fast-xml-builder": "1.1.7"
  "brace-expansion": "5.0.6"
  react: "catalog:"
  "react-dom": "catalog:"
  sharp: "0.34.5"

peerDependencyRules:
  allowedVersions:
    "@mintlify/mdx>react": "19"
    "@mintlify/mdx>react-dom": "19"
    "next-mdx-remote-client>react": "19"
    "next-mdx-remote-client>react-dom": "19"
    "@openstatus/react>react": "19"
    "react-simple-maps>react": "19"
    "react-simple-maps>react-dom": "19"

minimumReleaseAge: 0

recursiveInstall: true

nodeLinker: isolated

allowBuilds:
  "@scarf/scarf": false
  better-sqlite3: true
  core-js: false
  esbuild: true
  keytar: true
  puppeteer: true
  sharp: true
  "vue-demi": false
